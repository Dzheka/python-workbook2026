[project]
name = "python-workbook2026"
version = "0.1.0"
description = "A structured collection of Python exercises with automated tests"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

# Installing the workbook into its own venv puts the repo root on `sys.path`,
# which is what lets one exercise import another -- `infix_to_postfix` reuses
# the `precedence` function instead of copying it. Without this, the import
# resolves under pytest but not when a student runs the file directly, since
# Python puts only the script's own folder on the path.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "intro",
]

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
    "pytest>=8.4.2",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
